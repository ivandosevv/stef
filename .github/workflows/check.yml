name: Check stef
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python scripts/test-install.py
      - run: python scripts/test-install-sh.py
        if: runner.os != 'Windows'
      - run: python scripts/test-install-ps1.py
        if: runner.os == 'Windows'
      - run: python scripts/test-package-release.py
      - run: go vet ./...
        working-directory: daemon
      - run: go test ./...
        working-directory: daemon
      - run: npm run check
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: python scripts/smoke-portable.py --output artifacts/portable-runtime.json
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
        working-directory: ui
      - run: npm run test:e2e
        if: runner.os == 'Linux'
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            artifacts/portable-runtime.json
            ui/test-results/
          retention-days: 7
