name: Check stef
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python scripts/test-install.py
      - run: python scripts/test-install-sh.py
        if: runner.os != 'Windows'
      - run: python scripts/test-install-ps1.py
        if: runner.os == 'Windows'
      - run: python scripts/test-package-release.py
      - run: go vet ./...
        working-directory: daemon
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: daemon
      - run: go test ./...
        working-directory: daemon
      - run: npm run check
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm audit --omit=dev --audit-level=low
        working-directory: ui
      - run: python scripts/smoke-portable.py --output artifacts/portable-runtime.json
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
        working-directory: ui
      - run: npm run test:e2e
        if: runner.os == 'Linux'
        working-directory: ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            artifacts/portable-runtime.json
            ui/test-results/
          retention-days: 7
